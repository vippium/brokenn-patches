name: Mirror Everything to GitLab

on:
  push:
    branches: [ '**' ] # Triggers on every branch creation or commit
    tags: [ '*' ]      # Triggers on every tag creation or update
  delete:              # Triggers whenever any branch or tag is deleted on GitHub

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch all remote refs
        run: |
          git fetch --prune --update-head-ok origin "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"

      - name: Mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
        run: |
          AUTH_URL=$(echo "$GITLAB_URL" | sed "s|https://|https://oauth2:${GITLAB_TOKEN}@|")
          git remote add gitlab "$AUTH_URL"
          git push gitlab --prune "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
